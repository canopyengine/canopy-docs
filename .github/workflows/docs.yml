name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-docs.mjs
  build:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run build
  starter:
    name: Runnable terminal starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canopyengine/canopy
          ref: 51bf6e1580914c69d1da83530eba2b95a2fc2b3a
          path: .engine-source
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage matching alpha.2 source artifacts for validation
        working-directory: .engine-source
        run: ./gradlew publishToMavenLocal --max-workers=2 --console=plain -Dmaven.repo.local="$RUNNER_TEMP/canopy-alpha2-m2"
      - name: Build and exercise the matching alpha.2 starter
        working-directory: examples/terminal-starter
        run: ./gradlew -PcanopyRepository="$RUNNER_TEMP/canopy-alpha2-m2" build installDist run --args=--smoke --max-workers=2 --console=plain
      - name: Exercise published input bindings
        working-directory: examples/input-bindings
        run: ../terminal-starter/gradlew clean build run --max-workers=2 --console=plain
      - name: Exercise the learning scoreboard
        working-directory: examples/scoreboard
        run: ../terminal-starter/gradlew -PcanopyRepository="$RUNNER_TEMP/canopy-alpha2-m2" clean build installDist run --args=--smoke --max-workers=2 --console=plain
      - name: Verify terminal logging and installed launchers
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          python3 scripts/check-terminal-example.py examples/terminal-starter/build/install/canopy-terminal-starter/bin/canopy-terminal-starter
          python3 scripts/check-terminal-example.py examples/scoreboard/build/install/canopy-scoreboard/bin/canopy-scoreboard
