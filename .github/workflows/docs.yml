name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-docs.mjs
  build:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run build
  starter:
    name: Runnable terminal starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canopyengine/canopy
          ref: 61122d43706ee9e1e4aa78c84764545be2f46ee9
          path: .engine-source
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish matching development artifacts to an isolated repository
        working-directory: .engine-source
        run: ./gradlew publishToMavenLocal --max-workers=2 --console=plain -Dmaven.repo.local="$RUNNER_TEMP/canopy-m2"
      - name: Build and exercise the external starter
        working-directory: examples/terminal-starter
        run: ./gradlew build run --args=--smoke --max-workers=2 --console=plain -Dmaven.repo.local="$RUNNER_TEMP/canopy-m2"
