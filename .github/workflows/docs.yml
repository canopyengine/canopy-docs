name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main, codex/agent/docs/foundation-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-docs.mjs
  build:
    name: Documentation build
    # The pinned Playwright supports Ubuntu 24.04; ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install browser for learning-block checks
        run: npx playwright-core install --with-deps chromium
      - name: Check interactive lessons and offline draft
        run: npm run test:browser
  starter:
    name: Runnable terminal starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canopyengine/canopy
          ref: 195950196202d2b4f81eaf3bcd0e82920e5c92ad
          path: .engine-source
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage matching integration source artifacts for validation
        working-directory: .engine-source
        run: ./gradlew publishToMavenLocal --max-workers=2 --console=plain -Dmaven.repo.local="$RUNNER_TEMP/canopy-integration-m2"
      - name: Build and exercise the matching integration starter
        working-directory: examples/terminal-starter
        run: ./gradlew -PcanopyRepository="$RUNNER_TEMP/canopy-integration-m2" build installDist run --args=--smoke --max-workers=2 --console=plain
      - name: Exercise published input bindings
        working-directory: examples/input-bindings
        run: ../terminal-starter/gradlew clean build run --max-workers=2 --console=plain
      - name: Exercise the learning scoreboard
        working-directory: examples/scoreboard
        run: ../terminal-starter/gradlew -PcanopyRepository="$RUNNER_TEMP/canopy-integration-m2" clean build installDist run --args=--smoke --max-workers=2 --console=plain
      - name: Verify terminal logging and installed launchers
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          python3 scripts/check-terminal-example.py examples/terminal-starter/build/install/canopy-terminal-starter/bin/canopy-terminal-starter
          python3 scripts/check-terminal-example.py examples/scoreboard/build/install/canopy-scoreboard/bin/canopy-scoreboard
